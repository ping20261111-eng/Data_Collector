name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装 PyQt5 运行库
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff paramiko pyyaml PyQt5

      - name: Lint（ruff）
        run: ruff check data_collector tests

      - name: 单元测试
        env:
          # 无显示环境下跑界面测试
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
